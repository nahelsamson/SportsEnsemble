#C1D2CA">Résultats</text><text x="37" y="398" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#C1D2CA">Clubs</text><text x="37" y="459" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#C1D2CA">Photos</text><text x="315" y="143" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5B716E">CONTENUS / NOUVELLE INFORMATION</text><text x="315" y="195" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#132B32">Ajouter une information</text><rect x="1190" y="162" width="139" height="38" rx="19" fill="#D7F266" stroke="none"/><text x="1208" y="187" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#132B32">BROUILLON</text><text x="315" y="232" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#5B716E">Partagez une actualité, un événement ou un résultat avec vos lecteurs.</text><rect x="315" y="268" width="703" height="739" rx="16" fill="white" stroke="none"/><text x="345" y="309" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#132B32">1. L’essentiel</text><text x="345" y="350" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#132B32">Titre</text><rect x="345" y="363" width="643" height="46" rx="7" fill="#F6F7F0" stroke="#DCE1D7"/><text x="359" y="392" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#5B716E">Ex. : une journée pour découvrir votre club</text><text x="345" y="439" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#132B32">Type de contenu</text><rect x="345" y="452" width="306" height="46" rx="7" fill="#F6F7F0" stroke="#DCE1D7"/><text x="359" y="481" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#5B716E">Actualité                         ⌄</text><text x="675" y="439" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#132B32">Sport</text><rect x="675" y="452" width="313" height="46" rx="7" fill="#F6F7F0" stroke="#DCE1D7"/><text x="689" y="481" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#5B716E">Choisir un sport                 ⌄</text><text x="345" y="528" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#132B32">Club ou organisateur</text><rect x="345" y="541" width="306" height="46" rx="7" fill="#F6F7F0" stroke="#DCE1D7"/><text x="359" y="570" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#5B716E">Nom du club</text><text x="675" y="528" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#132B32">Date de l’événement (facultatif)</text><rect x="675" y="541" width="313" height="46" rx="7" fill="#F6F7F0" stroke="#DCE1D7"/><text x="689" y="570" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#5B716E">jj / mm / aaaa</text><text x="345" y="617" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#132B32">Lieu (facultatif)</text><rect x="345" y="630" width="643" height="46" rx="7" fill="#F6F7F0" stroke="#DCE1D7"/><text x="359" y="659" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#5B716E">Commune, stade ou salle</text><text x="345" y="710" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#132B32">2. Votre texte</text><rect x="345" y="731" width="643" height="179" rx="8" fill="#F6F7F0" stroke="#DCE1D7"/><text x="362" y="761" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#5B716E">B   I   • Liste   Ajouter un lien</text><path d="M345 778L988 778" stroke="#DCE1D7" fill="none"/><text x="362" y="810" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#5B716E">Racontez l’essentiel : qui, quoi, où et quand.</text><text x="362" y="839" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#5B716E">Ajoutez les détails utiles à vos lecteurs.</text><text x="345" y="949" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#132B32">Source ou lien utile (facultatif)</text><rect x="345" y="962" width="643" height="46" rx="7" fill="#F6F7F0" stroke="#DCE1D7"/><text x="359" y="991" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#5B716E">https://</text><rect x="1044" y="268" width="332" height="318" rx="16" fill="white" stroke="none"/><text x="1070" y="310" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#132B32">Photo de couverture</text><rect x="1070" y="333" width="280" height="152" rx="9" fill="#F6F7F0" stroke="#DCE1D7"/><text x="1188" y="396" font-family="Arial, sans-serif" font-size="42" font-weight="400" fill="#5B716E">+</text><text x="1104" y="446" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#5B716E">Choisir une image</text><text x="1070" y="525" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#5B716E">Utilisez une photo que vous avez</text><text x="1070" y="548" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#5B716E">le droit de partager.</text><rect x="1044" y="612" width="332" height="243" rx="16" fill="white" stroke="none"/><text x="1070" y="657" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#132B32">Prêt à être lu ?</text><text x="1070" y="695" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#5B716E">Relisez le texte, vérifiez la date</text><text x="1070" y="720" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#5B716E">et ajoutez une source si utile.</text><rect x="1070" y="755" width="280" height="48" rx="10" fill="#F6F7F0" stroke="none"/><text x="1090" y="785" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#132B32">Prévisualiser</text><rect x="315" y="1030" width="243" height="48" rx="10" fill="#132B32" stroke="none"/><text x="335" y="1060" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white">Enregistrer le brouillon</text><rect x="579" y="