services:
  - type: web
    name: sportsensemble-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: sportsensemble
      - key: FRONTEND_ORIGINS
        value: https://nahelsamson.github.io
      - key: MONGODB_URI
        sync: false
