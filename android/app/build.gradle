plugins { id 'com.android.application' }
android {
    namespace 'fr.sportsensemble.agenda'
    compileSdk 36
    buildFeatures { resValues true }
    defaultConfig {
        applicationId 'fr.sportsensemble.agenda'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.3.0'
        resValue 'string', 'default_server_url', (project.findProperty('mobileServer') ?: 'https://sportsensemble-api.onrender.com')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // A local key lets subsequent debug APKs update the installed app.
    signingConfigs { debug { storeFile file('../../.private/android-debug.keystore') } }
    // Preserve the existing install identity; the public APK disables debugging.
    buildTypes { release { signingConfig signingConfigs.debug; debuggable false } }
}
